name: Build

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Materialize binary assets
        run: |
          mkdir -p app/src/main/res/drawable-xhdpi app/src/main/res/mipmap-mdpi \
                   app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-xhdpi \
                   app/src/main/res/mipmap-xxhdpi
          base64 -d assets-src/drawable-xhdpi-banner.png.b64 > app/src/main/res/drawable-xhdpi/banner.png
          base64 -d assets-src/drawable-xhdpi-cover_placeholder.png.b64 > app/src/main/res/drawable-xhdpi/cover_placeholder.png
          base64 -d assets-src/mipmap-mdpi-ic_launcher.png.b64 > app/src/main/res/mipmap-mdpi/ic_launcher.png
          base64 -d assets-src/mipmap-hdpi-ic_launcher.png.b64 > app/src/main/res/mipmap-hdpi/ic_launcher.png
          base64 -d assets-src/mipmap-xhdpi-ic_launcher.png.b64 > app/src/main/res/mipmap-xhdpi/ic_launcher.png
          base64 -d assets-src/mipmap-xxhdpi-ic_launcher.png.b64 > app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          ls -l app/src/main/res/drawable-xhdpi app/src/main/res/mipmap-xhdpi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Generate Gradle wrapper if missing
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.5
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add gradle/wrapper gradlew gradlew.bat || true
            git commit -m "ci: add gradle wrapper [skip ci]" || echo "nothing to commit"
            git push || echo "wrapper push skipped"
          fi

      - name: Restore signing keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "SIGNED=false" >> "$GITHUB_ENV"
            echo "::warning::KEYSTORE_BASE64 secret not set; building unsigned APK"
          fi

      - name: Build release APK
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          set +e
          if [ -f gradlew ]; then
            ./gradlew assembleRelease --stacktrace > gradle-build.log 2>&1
          else
            gradle assembleRelease --stacktrace > gradle-build.log 2>&1
          fi
          echo "gradle_exit=$?" >> gradle-build.log
          tail -60 gradle-build.log
          ls -lh app/build/outputs/apk/release/ || true

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AlgerTV-1.0-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Publish build output to build-output branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          STAGE=/tmp/stage
          mkdir -p "$STAGE/apk"
          {
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "ref=${{ github.ref }}"
            echo "sha=${{ github.sha }}"
            echo "signed=${SIGNED:-unknown}"
          } > "$STAGE/build-info.txt"
          APK=app/build/outputs/apk/release/AlgerTV-1.0.apk
          if [ -f "$APK" ]; then
            SIZE=$(stat -c%s "$APK")
            SHA=$(sha256sum "$APK" | cut -d' ' -f1)
            echo "apk_size=$SIZE" >> "$STAGE/build-info.txt"
            echo "apk_sha256=$SHA" >> "$STAGE/build-info.txt"
            base64 -w0 "$APK" > /tmp/apk.b64
            split -b 900000 -d /tmp/apk.b64 "$STAGE/apk/apk.part."
          else
            echo "apk_missing=1" >> "$STAGE/build-info.txt"
          fi
          tail -400 gradle-build.log > "$STAGE/build-log.txt" 2>/dev/null || echo "no log" > "$STAGE/build-log.txt"
          cat "$STAGE/build-info.txt"

          rm -rf /tmp/outrepo
          if git clone --branch build-output "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" /tmp/outrepo 2>/dev/null; then
            echo "cloned existing build-output"
          else
            git clone "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" /tmp/outrepo
            cd /tmp/outrepo && git checkout --orphan build-output && git rm -rf . > /dev/null 2>&1
            cd - > /dev/null
          fi
          cp -r "$STAGE"/* /tmp/outrepo/
          cd /tmp/outrepo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build output for ${{ github.sha }}" || echo "nothing to commit"
          git push origin build-output
          echo "published to build-output"

      - name: Create GitHub Release (tags, signed builds only)
        if: startsWith(github.ref, 'refs/tags/') && env.SIGNED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            app/build/outputs/apk/release/AlgerTV-1.0.apk \
            --title "Alger轻听 ${GITHUB_REF_NAME}" \
            --notes "Alger轻听 ${GITHUB_REF_NAME}（原生轻量版，免登录）"

      - name: Fail if APK missing
        run: |
          test -f app/build/outputs/apk/release/AlgerTV-1.0.apk
